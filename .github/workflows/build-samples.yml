name: Build compatibility samples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sample generator image
        run: docker build --tag grind-sample-corpus .
      - name: Generate and import samples
        run: docker run --rm --volume "$GITHUB_WORKSPACE/samples:/workspace/samples" grind-sample-corpus
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-samples
          path: samples/compatibility/
          if-no-files-found: error